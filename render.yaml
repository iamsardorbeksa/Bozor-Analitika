# Render blueprint: backend web service + managed PostgreSQL
databases:
  - name: bozor-db
    plan: free
    databaseName: bozor
services:
  - type: web
    name: bozor-analitika-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: bozor-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
      - key: ANTHROPIC_API_KEY
        sync: false
